[project]
name = "viva"
version = "0.1.0"
description = "VIVA — ABTalks AI Interview Agent. The interviewer that knows what you built."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.state", "app.core", "app.routes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
